{% extends "base.html" %}
{% block title %}Mark Attendance – High Profile Private Secondary School{% endblock %}

{% block content %}
<h4 class="fw-bold mb-3 text-navy">Mark Attendance</h4>

<div class="card mb-3">
    <div class="card-body">
        <div class="row g-2">
            <div class="col-12 col-md-6">
                <label class="form-label small fw-semibold">Class</label>
                <select id="classSelect" class="form-select form-select-lg">
                    <option value="">Select class...</option>
                </select>
            </div>
            <div class="col-12 col-md-4">
                <label class="form-label small fw-semibold">Date</label>
                <input type="date" id="attendanceDate" class="form-control form-control-lg">
            </div>
            <div class="col-12 col-md-2 d-flex align-items-end">
                <button class="btn btn-primary btn-lg w-100" onclick="loadStudents()">
                    <i class="bi bi-arrow-right"></i> Load
                </button>
            </div>
        </div>
    </div>
</div>

<div id="quickActions" class="d-none mb-3">
    <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-success btn-sm" onclick="markAll('present')">
            <i class="bi bi-check-all"></i> All Present
        </button>
        <button class="btn btn-outline-secondary btn-sm" onclick="markAll('absent')">
            All Absent
        </button>
        <span class="ms-auto text-muted small align-self-center" id="studentCount"></span>
    </div>
</div>

<div id="studentsContainer" class="d-none">
    <div class="card">
        <div class="list-group list-group-flush" id="studentsList"></div>
    </div>
    <div class="d-grid gap-2 mt-3">
        <button class="btn btn-primary btn-lg" id="saveBtn" onclick="saveAttendance()">
            <i class="bi bi-save"></i> Save Attendance
        </button>
    </div>
</div>

<div id="emptyState" class="text-center text-muted py-5">
    <i class="bi bi-clipboard-check" style="font-size: 3rem;"></i>
    <p class="mt-2">Select class and date, then click Load</p>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentStudents = [];
let attendanceState = {};

document.getElementById('attendanceDate').valueAsDate = new Date();

function getDisplayName(s) {
    if (s.full_name && String(s.full_name).trim()) return String(s.full_name).trim();
    return (String(s.first_name || '').trim() + ' ' + String(s.last_name || '').trim()).trim();
}

function sortStudents(students) {
    return students.slice().sort(function(a, b) {
        var an = getDisplayName(a).toLowerCase();
        var bn = getDisplayName(b).toLowerCase();
        if (an < bn) return -1;
        if (an > bn) return 1;
        return String(a.admission_number || '').localeCompare(String(b.admission_number || ''));
    });
}

async function loadClasses() {
    var res = await api('/api/classes');
    var classes = await res.json();
    var select = document.getElementById('classSelect');
    classes.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        select.appendChild(opt);
    });
}

async function loadStudents() {
    var classId = document.getElementById('classSelect').value;
    var date = document.getElementById('attendanceDate').value;
    if (!classId || !date) {
        alert('Please select class and date');
        return;
    }

    var res = await api('/api/classes/' + classId + '/students');
    var students = await res.json();
    currentStudents = sortStudents(students);

    var attRes = await api('/api/attendance/' + classId + '?date=' + date);
    var existing = await attRes.json();
    attendanceState = {};
    existing.forEach(function(r) {
        attendanceState[r.student_id] = {
            status: r.status,
            reason: r.reason || '',
            communicated: r.communicated || 'unknown'
        };
    });

    renderStudents();
    document.getElementById('emptyState').classList.add('d-none');
    document.getElementById('studentsContainer').classList.remove('d-none');
    document.getElementById('quickActions').classList.remove('d-none');
    document.getElementById('studentCount').textContent = currentStudents.length + ' students';
}

function renderStudents() {
    var list = document.getElementById('studentsList');
    list.innerHTML = '';

    currentStudents.forEach(function(s) {
        var state = attendanceState[s.id] || { status: null, reason: '', communicated: 'unknown' };
        var rowClass = state.status === 'present' ? 'present' : (state.status === 'absent' ? 'absent' : '');
        var name = getDisplayName(s);

        var div = document.createElement('div');
        div.className = 'list-group-item student-row ' + rowClass;
        div.innerHTML =
            '<div class="d-flex justify-content-between align-items-start">' +
            '<div class="flex-grow-1">' +
            '<div class="fw-semibold">' + name + '</div>' +
            '<small class="text-muted">' + (s.admission_number || '') + '</small>' +
            '</div>' +
            '<div class="btn-group btn-group-sm">' +
            '<button class="btn ' + (state.status === 'present' ? 'btn-success' : 'btn-outline-success') + '" onclick="setStatus(' + s.id + ', \'present\')"><i class="bi bi-check-lg"></i></button>' +
            '<button class="btn ' + (state.status === 'absent' ? 'btn-danger' : 'btn-outline-danger') + '" onclick="setStatus(' + s.id + ', \'absent\')"><i class="bi bi-x-lg"></i></button>' +
            '</div>' +
            '</div>' +
            '<div class="reason-input mt-2 ' + (state.status === 'absent' ? 'show' : '') + '" id="reason-' + s.id + '">' +
            '<div class="row g-2">' +
            '<div class="col-12">' +
            '<select class="form-select form-select-sm" onchange="updateField(' + s.id + ', \'reason\', this.value)">' +
            '<option value="">Select reason...</option>' +
            '<option value="Sick"' + (state.reason === 'Sick' ? ' selected' : '') + '>Sick</option>' +
            '<option value="Family emergency"' + (state.reason === 'Family emergency' ? ' selected' : '') + '>Family emergency</option>' +
            '<option value="Transport issues"' + (state.reason === 'Transport issues' ? ' selected' : '') + '>Transport issues</option>' +
            '<option value="Permission granted"' + (state.reason === 'Permission granted' ? ' selected' : '') + '>Permission granted</option>' +
            '<option value="Unknown / No reason"' + (state.reason === 'Unknown / No reason' ? ' selected' : '') + '>Unknown / No reason</option>' +
            '<option value="Other"' + (state.reason === 'Other' ? ' selected' : '') + '>Other</option>' +
            '</select>' +
            '</div>' +
            '<div class="col-12">' +
            '<select class="form-select form-select-sm" onchange="updateField(' + s.id + ', \'communicated\', this.value)">' +
            '<option value="unknown"' + (state.communicated === 'unknown' ? ' selected' : '') + '>Parent informed?</option>' +
            '<option value="yes"' + (state.communicated === 'yes' ? ' selected' : '') + '>Yes – Parent informed</option>' +
            '<option value="no"' + (state.communicated === 'no' ? ' selected' : '') + '>No – Not informed</option>' +
            '</select>' +
            '</div>' +
            '</div>' +
            '</div>';
        list.appendChild(div);
    });
}

function setStatus(studentId, status) {
    if (!attendanceState[studentId]) {
        attendanceState[studentId] = { status: null, reason: '', communicated: 'unknown' };
    }
    attendanceState[studentId].status = status;
    if (status === 'present') {
        attendanceState[studentId].reason = '';
        attendanceState[studentId].communicated = 'unknown';
    }
    renderStudents();
}

function updateField(studentId, field, value) {
    if (!attendanceState[studentId]) return;
    attendanceState[studentId][field] = value;
}

function markAll(status) {
    currentStudents.forEach(function(s) {
        attendanceState[s.id] = {
            status: status,
            reason: status === 'absent' ? (attendanceState[s.id] ? attendanceState[s.id].reason : '') : '',
            communicated: status === 'absent' ? (attendanceState[s.id] ? attendanceState[s.id].communicated : 'unknown') : 'unknown'
        };
    });
    renderStudents();
}

async function saveAttendance() {
    var classId = document.getElementById('classSelect').value;
    var date = document.getElementById('attendanceDate').value;

    var records = currentStudents.map(function(s) {
        var state = attendanceState[s.id] || { status: 'present', reason: '', communicated: 'unknown' };
        return {
            student_id: s.id,
            status: state.status || 'present',
            reason: state.reason || null,
            communicated: state.communicated || 'unknown'
        };
    });

    var btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';

    try {
        var res = await api('/api/attendance/mark', {
            method: 'POST',
            body: JSON.stringify({
                class_id: parseInt(classId),
                date: date,
                records: records
            })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Save failed');
        alert(data.message);
    } catch (err) {
        alert('Error: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-save"></i> Save Attendance';
    }
}

loadClasses();
</script>
{% endblock %}
